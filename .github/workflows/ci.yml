name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Validate JSON resources
        run: |
          python3 -m json.tool shared-vocabulary.json > /dev/null
          python3 -m json.tool Sources/WhiskerFlow/Resources/shared-vocabulary.json > /dev/null

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Shell packaging tests
        run: |
          set -euo pipefail
          for t in script/test_*.sh; do
            echo "== $t"
            bash "$t"
          done

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftFormat
        run: |
          set -euo pipefail
          formatter_dir="$RUNNER_TEMP/swiftformat-$SWIFTFORMAT_VERSION"
          mkdir -p "$formatter_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip" \
            --output "$formatter_dir/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $formatter_dir/swiftformat.zip" | shasum -a 256 --check
          unzip -q "$formatter_dir/swiftformat.zip" -d "$formatter_dir"
          "$formatter_dir/swiftformat" --version | grep -qx "$SWIFTFORMAT_VERSION"
          echo "$formatter_dir" >> "$GITHUB_PATH"
        env:
          SWIFTFORMAT_VERSION: "0.62.1"
          SWIFTFORMAT_SHA256: "7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a"

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint
