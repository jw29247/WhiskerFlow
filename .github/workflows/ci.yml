name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Validate JSON resources
        run: |
          python3 -m json.tool shared-vocabulary.json > /dev/null
          python3 -m json.tool Sources/WhiskerFlow/Resources/shared-vocabulary.json > /dev/null

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Shell packaging tests
        run: |
          set -euo pipefail
          for t in script/test_*.sh; do
            echo "== $t"
            bash "$t"
          done

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Pinned: an unpinned formatter picks up new rules on its own schedule and
      # turns a green branch red without a commit touching it.
      - name: Install SwiftFormat
        run: |
          set -euo pipefail
          brew install swiftformat
          swiftformat --version | grep -qx "$SWIFTFORMAT_VERSION" || {
            echo "swiftformat $(swiftformat --version) != pinned $SWIFTFORMAT_VERSION" >&2
            echo "review the new rules, then bump SWIFTFORMAT_VERSION" >&2
            exit 1
          }
        env:
          SWIFTFORMAT_VERSION: "0.62.1"

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint
