name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Validate JSON resources
        run: |
          python3 -m json.tool shared-vocabulary.json > /dev/null
          python3 -m json.tool Sources/WhiskerFlow/Resources/shared-vocabulary.json > /dev/null

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Shell packaging tests
        run: |
          set -euo pipefail
          for t in script/test_*.sh; do
            echo "== $t"
            bash "$t"
          done

  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint
