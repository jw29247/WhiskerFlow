name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Swift build and every test target.
  tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Validate JSON resources
        run: |
          python3 -m json.tool shared-vocabulary.json > /dev/null
          python3 -m json.tool Sources/WhiskerFlow/Resources/shared-vocabulary.json > /dev/null

      # Restored on every run, saved only from main (below): each saved
      # .build is about 1.6 GB, and pull requests saving their own copies
      # filled the repository's 10 GB cache and evicted main's, so later runs
      # rebuilt every dependency from scratch.
      - name: Restore SwiftPM cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-tests-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-tests-${{ runner.os }}-
            spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Save SwiftPM cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The shell tests, in parallel with the tests job. test_bundle_app.sh
  # makes its own optimised build, so this job does not need the one above.
  packaging:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Restore SwiftPM cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-packaging-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-packaging-${{ runner.os }}-
            spm-${{ runner.os }}-

      - name: Shell packaging tests
        run: |
          set -euo pipefail
          for t in script/test_*.sh; do
            echo "== $t"
            bash "$t"
          done

      - name: Save SwiftPM cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The required check. It passes only when every job above passed: without
  # this job a skipped dependant would count as success for branch
  # protection. A run superseded by a newer push is cancelled as a whole and
  # reports nothing here.
  build-test:
    needs: [tests, packaging]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and packaging
        env:
          TESTS: ${{ needs.tests.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          echo "tests: $TESTS, packaging: $PACKAGING"
          [[ "$TESTS" == success && "$PACKAGING" == success ]]

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftFormat
        run: |
          set -euo pipefail
          formatter_dir="$RUNNER_TEMP/swiftformat-$SWIFTFORMAT_VERSION"
          mkdir -p "$formatter_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip" \
            --output "$formatter_dir/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $formatter_dir/swiftformat.zip" | shasum -a 256 --check
          unzip -q "$formatter_dir/swiftformat.zip" -d "$formatter_dir"
          "$formatter_dir/swiftformat" --version | grep -qx "$SWIFTFORMAT_VERSION"
          echo "$formatter_dir" >> "$GITHUB_PATH"
        env:
          SWIFTFORMAT_VERSION: "0.62.1"
          SWIFTFORMAT_SHA256: "7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a"

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint
