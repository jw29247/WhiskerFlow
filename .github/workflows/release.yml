name: Package (verification only)

# CI has no Developer ID certificate, so it can only produce an ad-hoc
# (unsigned, un-notarized) build that Gatekeeper would block on download.
# This job therefore only verifies that packaging succeeds — it does NOT publish
# any release assets. The shareable, notarized DMG is produced locally with
# `script/notarize.sh` (see Distribution/SIGNING.md). To notarize in CI instead,
# add Developer ID + App Store Connect secrets and restore a publish step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Resources/Info.plist is the single source of the version. A tag that
      # disagrees with it would package the wrong version, so fail early.
      - name: Verify the tag matches Resources/Info.plist
        if: github.ref_type == 'tag'
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PLIST_VERSION" ]]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION." >&2
            exit 1
          fi

      - name: Build packaging artifacts (unsigned — not published)
        run: script/package_release.sh
